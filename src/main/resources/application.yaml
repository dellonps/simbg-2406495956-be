spring:
  jackson:
    time-zone: Asia/Jakarta
  config:
    import: optional:file:.env[.properties]

  application:
    name: simbg-2406495956-be

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true